<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <style>
        body {
            background: #f6f7fb;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .profile-box {
            max-width: 400px;
            margin: 48px auto;
            background: #fff;
            padding: 28px 22px 22px 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #222a35;
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #222a35;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }
        button {
            background: #276ef1;
            color: #fff;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover {
            background: #174ea6;
        }
        .cancel-link {
            margin-left: 16px;
            color: #276ef1;
            text-decoration: none;
            font-size: 1rem;
        }
        .cancel-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .profile-box { width: 98vw; padding: 10px; }
        }
    </style>
</head>
<body>
<div class="profile-box">
    <h2>Edit Profile</h2>
    <form method="POST">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>

        <label for="vehicle_number">Vehicle Number</label>
        <input type="text" id="vehicle_number" name="vehicle_number" value="{{ user.vehicle_number }}">

        <label for="password">New Password (leave blank to keep current)</label>
        <input type="password" id="password" name="password">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required>

        <button type="submit">Update Profile</button>
        <a href="{{ url_for('user_dashboard') }}" class="cancel-link">Cancel</a>
    </form>
</div>
</body>
</html>
