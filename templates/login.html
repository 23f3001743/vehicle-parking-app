<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #9a10af;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #f5e9fa;
            padding: 36px 28px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #222a35;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background: #0056b3;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #007BFF;
            text-decoration: none;
            font-size: 1rem;
        }
        a:hover {
            text-decoration: underline;
        }
        .message {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Login To Your Space</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
        <input type="email" name="email" placeholder="Email" autocomplete="off" required>
        <input type="password" name="password"  placeholder="Password" autocomplete="off" required>
        <button type="submit">Log In</button>
    </form>
    <a href="{{ url_for('register') }}">Don't have an account? Register here</a>
</div>
</body>
</html>
